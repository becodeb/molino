# Para correrlo en local. En producción la app y la base las administra Coolify.
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://molino:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@db:5432/molino?sslmode=disable
      PORT: "8080"
      DEV_PASSWORD: ${DEV_PASSWORD:-}
      AI_ROUTER_URL: ${AI_ROUTER_URL:-https://ai-router.becode.com.ar}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: molino
      POSTGRES_DB: molino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes:
      - molino-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U molino -d molino"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  molino-db:
