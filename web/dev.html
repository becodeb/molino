<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Taller de la Isla</title>
<meta name="theme-color" content="#0c2730">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2310303a'/%3E%3Cg fill='%23fff1d0'%3E%3Cpath d='M32 32 26 8h12z'/%3E%3Cpath d='M32 32 26 56h12z'/%3E%3Cpath d='M32 32 8 26v12z'/%3E%3Cpath d='M32 32 56 26v12z'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='6' fill='%237fd8e8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/panel.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/"><svg viewBox="0 0 64 64" aria-hidden="true"><g fill="#fff4d9"><path d="M32 32 26 6h12z"/><path d="M32 32 26 58h12z"/><path d="M32 32 6 26v12z"/><path d="M32 32 58 26v12z"/></g><circle cx="32" cy="32" r="6" fill="#7fd8e8"/></svg>Taller de la Isla</a>
    <span class="muted" id="stats"></span>
  </header>

  <form id="vLogin" class="card login rise hidden">
    <h2>Entrar al taller</h2>
    <label class="label" for="clave">Clave</label>
    <input id="clave" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Entrar</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>

  <main id="vDev" class="dev-grid hidden rise">
    <section class="card chat" aria-label="Chat con la IA">
      <div id="log" aria-live="polite"></div>
      <form id="chatForm">
        <textarea id="chatInput" rows="1" placeholder="Contale qué querés corregir…" aria-label="Mensaje"></textarea>
        <button class="btn primary" id="btnSend" type="submit">Enviar</button>
      </form>
    </section>
    <aside class="card side">
      <div class="tabs" role="tablist">
        <button type="button" data-tab="cfg" class="on">Parámetros</button>
        <button type="button" data-tab="hist">Historial</button>
        <button type="button" data-tab="req">Pedidos</button>
      </div>
      <div id="tabCfg"></div>
      <div id="tabHist" class="hidden"></div>
      <div id="tabReq" class="hidden"></div>
    </aside>
  </main>
</div>
<script src="/dev.js"></script>
</body>
</html>
