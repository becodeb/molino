<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Taller de Atrapavientos</title>
<meta name="theme-color" content="#0c2730">
<link rel="icon" href="/northfield.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/panel.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/"><img src="/northfield.png" alt="" width="30" height="38">Taller de Atrapavientos</a>
    <span class="muted" id="stats"></span>
  </header>

  <form id="vLogin" class="card login rise hidden">
    <h2>Entrar al taller</h2>
    <label class="label" for="clave">Clave</label>
    <input id="clave" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Entrar</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>

  <main id="vDev" class="dev-grid hidden rise">
    <section class="card chat" aria-label="Chat con la IA">
      <div id="log" aria-live="polite"></div>
      <form id="chatForm">
        <textarea id="chatInput" rows="1" placeholder="Contale qué querés corregir…" aria-label="Mensaje"></textarea>
        <button class="btn primary" id="btnSend" type="submit">Enviar</button>
      </form>
    </section>
    <aside class="card side">
      <div class="tabs" role="tablist">
        <button type="button" data-tab="cfg" class="on">Parámetros</button>
        <button type="button" data-tab="hist">Historial</button>
        <button type="button" data-tab="req">Pedidos</button>
      </div>
      <div id="tabCfg"></div>
      <div id="tabHist" class="hidden"></div>
      <div id="tabReq" class="hidden"></div>
    </aside>
  </main>
</div>
<script src="/dev.js"></script>
</body>
</html>
